<style>
.focus-section {
  width: 100%;
  padding: 70px 25px;
  box-sizing: border-box;
  background: #fff;
}

.focus-grid {
  width: 100%;
  max-width: 1250px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
}

.focus-card {
  position: relative;
  height: 420px;
  overflow: hidden;
  display: block;
  border-radius: 18px;
  background: #111;
  isolation: isolate;
  color: #fff;
  text-decoration: none;
  cursor: pointer;
  transition: transform .55s ease, filter .55s ease, opacity .55s ease, box-shadow .55s ease;
}

.focus-card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.02);
  transition: transform .8s ease;
}

.focus-card::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.15) 50%, transparent);
}

.focus-overlay {
  position: absolute;
  z-index: 2;
  left: 25px;
  right: 25px;
  bottom: 24px;
  transform: translateY(18px);
  opacity: .75;
  transition: transform .5s ease, opacity .5s ease;
}

.focus-overlay h3 {
  margin: 0;
  color: #fff;
  font: 600 22px/1.2 Arial, Helvetica, sans-serif;
}

.focus-card:hover,
.focus-card:focus-visible {
  z-index: 3;
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 25px 55px rgba(0,0,0,.25);
}

.focus-card:hover img,
.focus-card:focus-visible img {
  transform: scale(1.1);
}

.focus-card:hover .focus-overlay,
.focus-card:focus-visible .focus-overlay {
  transform: translateY(0);
  opacity: 1;
}

.focus-grid:hover .focus-card:not(:hover) {
  transform: scale(.96);
  filter: brightness(.55) blur(1px);
  opacity: .65;
}

@media (max-width: 950px) {
  .focus-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }
  .focus-card { height: 380px; }
}

@media (max-width: 600px) {
  .focus-section { padding: 45px 16px; }
  .focus-grid { grid-template-columns: 1fr; gap: 16px; }
  .focus-card { height: 390px; border-radius: 15px; }
  .focus-overlay { left: 20px; right: 20px; bottom: 20px; }
  .focus-overlay h3 { font-size: 20px; }
}

@media (hover: none) {
  .focus-grid:hover .focus-card:not(:hover) {
    transform: none;
    filter: none;
    opacity: 1;
  }
  .focus-card:active { transform: scale(.98); }
}

<script>
(() => {
  const cards = document.querySelectorAll(".focus-card");
  const canTilt = matchMedia("(hover: hover) and (pointer: fine)").matches;
  if (!canTilt) return;

  cards.forEach(card => {
    card.addEventListener("mousemove", event => {
      const rect = card.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -3;
      const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 3;

      card.style.transform =
        `translateY(-8px) scale(1.02) perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    card.addEventListener("mouseleave", () => {
      card.style.transform = "";
    });
  });
})();
</script>
